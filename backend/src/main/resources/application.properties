server.port=${PORT:8085}
spring.application.name=exercise-substitution

# Data files. Override with env vars EXSUB_DATA_EXERCISESPATH / EXSUB_DATA_RULESPATH,
# e.g. EXSUB_DATA_EXERCISESPATH=file:/abs/path/exercises.json
exsub.data.exercises-path=classpath:data/exercises.json
exsub.data.rules-path=classpath:data/injury_rules.json

# Target false-positive probability used to size the Bloom filter (env: EXSUB_BLOOM_FPP)
exsub.bloom.fpp=0.01

# Frontend origins allowed by CORS (env: EXSUB_CORS_ALLOWEDORIGINS)
exsub.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

spring.jackson.default-property-inclusion=non_null
